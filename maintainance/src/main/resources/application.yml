jwt:
  config:
    secret: LWJ1FUzrA4cpm7U6XLXtRgR5RVxg7mHtQwNzdUFetAY=
    expirationMs: 86400000

# Used to resolve Today / Tomorrow / Day-after for WhatsApp scheduling (IANA id). Override with FIXORA_APP_TIMEZONE.
fixora:
  app:
    timezone: ${FIXORA_APP_TIMEZONE:Asia/Dubai}
  # Payment gateway callbacks: when set, callers must send header X-Fixora-Signature = hex(HMAC-SHA256(secret, ticketId|amount|paymentRef|gatewayStatus)).
  payment:
    callback:
      secret: ${FIXORA_PAYMENT_CALLBACK_SECRET:}

app:
  media:
    # Media storage mode: s3 | direct
    # - s3: download Twilio media and upload to S3 (default/backward-compatible)
    # - direct: store Twilio media URL directly (no AWS/S3 beans required)
    storage-type: ${APP_MEDIA_STORAGE_TYPE:direct}

spring:
  datasource:
    url: "jdbc:postgresql://localhost:5432/maintainance-db"
    username: postgres
    password: 0163625818aA@
    driver: org.postgres.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: update  # or validate, none, create-drop (depending on your use case)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

aws:
  s3:
    bucket-name: fixora-maintenance
    region: us-east-1
  # Optional - if not using IAM roles:
  access-key-id: your-access-key
  secret-access-key: your-secret-key

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  sender-whatsapp-number: ${TWILIO_SENDER_WHATSAPP:whatsapp:+14155238886}
  # Optional: Twilio Content Template SIDs for real WhatsApp quick-reply buttons (Console → Messaging → Content).
  # Leave empty to keep plain-text fallback (bullet + "reply: ID"). Variables must match your template placeholders.
  whatsapp:
    content:
      welcome-buttons-sid: ${TWILIO_CONTENT_WELCOME_BUTTONS_SID:}
      # JSON object for Content template variables (override via env or replace here).
      welcome-buttons-variables: "{}"
      visit-date-buttons-sid: ${TWILIO_CONTENT_VISIT_DATE_BUTTONS_SID:}
      visit-date-buttons-variables: "{}"
      visit-slot-buttons-sid: ${TWILIO_CONTENT_VISIT_SLOT_BUTTONS_SID:}
      visit-slot-buttons-variables: "{}"
      # Optional: send templates via Messaging Service instead of From (some Twilio setups).
      messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}

